openapi: 3.0.3
info:
  title: API Tienda en Línea (microservicios)
  description: Contratos REST del API Gateway para catálogo, carrito, órdenes, pagos y envíos.
  version: 1.0.0
servers:
  - url: https://api.tienda.example.com/api/v1
security:
  - bearerAuth: []
tags:
  - name: Productos
  - name: Carrito
  - name: Órdenes
  - name: Envíos
  - name: Pagos
paths:
  /products:
    get:
      tags: [Productos]
      summary: Buscar productos con filtros y paginación
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Texto de búsqueda }
        - { name: category, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, example: "price,-createdAt" } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Lista paginada de productos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [Productos]
      summary: Crear producto (administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
  /products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Productos]
      summary: Consultar un producto
      security: []
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Productos]
      summary: Actualizar producto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
    delete:
      tags: [Productos]
      summary: Eliminar producto
      responses:
        '204': { description: Eliminado }
  /cart:
    get:
      tags: [Carrito]
      summary: Consultar el carrito del usuario
      responses:
        '200':
          description: Carrito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/items:
    post:
      tags: [Carrito]
      summary: Agregar un producto al carrito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: string }
                quantity: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '409': { description: Stock insuficiente }
  /cart/items/{itemId}:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Carrito]
      summary: Cambiar la cantidad de un ítem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Carrito actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
    delete:
      tags: [Carrito]
      summary: Quitar un ítem del carrito
      responses:
        '204': { description: Eliminado }
  /orders:
    post:
      tags: [Órdenes]
      summary: Crear una orden a partir del carrito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingAddress]
              properties:
                shippingAddress: { $ref: '#/components/schemas/Address' }
      responses:
        '201':
          description: Orden creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
    get:
      tags: [Órdenes]
      summary: Listar órdenes del usuario
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Lista paginada de órdenes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Order' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
  /orders/{id}:
    get:
      tags: [Órdenes]
      summary: Consultar una orden
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Orden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/cancel:
    post:
      tags: [Órdenes]
      summary: Cancelar una orden (solo si aún no fue enviada)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Orden cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { description: La orden ya no puede cancelarse }
  /payments:
    post:
      tags: [Pagos]
      summary: Iniciar el pago de una orden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, method]
              properties:
                orderId: { type: string }
                method: { type: string, enum: [CARD, PSE, WALLET] }
                token: { type: string, description: Token de la pasarela (nunca el número de tarjeta) }
      responses:
        '201':
          description: Pago registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
  /payments/{id}:
    get:
      tags: [Pagos]
      summary: Consultar un pago
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Pago
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
  /payments/webhook:
    post:
      tags: [Pagos]
      summary: Notificación de la pasarela de pago
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '202': { description: Notificación recibida }
  /shipments:
    post:
      tags: [Envíos]
      summary: Crear envío para una orden pagada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string }
                carrier: { type: string }
      responses:
        '201':
          description: Envío creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
  /shipments/{id}/tracking:
    get:
      tags: [Envíos]
      summary: Seguimiento del envío
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Estado del envío
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Money:
      type: object
      properties:
        amount: { type: number }
        currency: { type: string, example: COP }
    Address:
      type: object
      properties:
        street: { type: string }
        city: { type: string }
        state: { type: string }
        zip: { type: string }
        country: { type: string }
    ProductInput:
      type: object
      required: [sku, name, price]
      properties:
        sku: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        categoryId: { type: string }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          properties:
            id: { type: string }
            rating: { type: number }
            available: { type: boolean }
    CartItem:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        quantity: { type: integer }
        unitPrice: { $ref: '#/components/schemas/Money' }
    Cart:
      type: object
      properties:
        id: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        total: { $ref: '#/components/schemas/Money' }
    OrderStatus:
      type: string
      enum: [BORRADOR, PAGADA, EMPACADA, ENVIADA, ENTREGADA, CANCELADA]
    Order:
      type: object
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        total: { $ref: '#/components/schemas/Money' }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        createdAt: { type: string, format: date-time }
    Payment:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        status: { type: string, enum: [PENDIENTE, APROBADO, RECHAZADO, REEMBOLSADO] }
        amount: { $ref: '#/components/schemas/Money' }
    Shipment:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        carrier: { type: string }
        trackingNumber: { type: string }
        status: { type: string, enum: [PREPARANDO, EN_TRANSITO, ENTREGADO] }
